# 프로젝트 목록과 로드맵. 이 파일은 직접 편집한다 (프로그램은 메일에 "변경 제안"만 적는다).
#
# status:  active  = 진행 중 (메일 표에 나오고, stale_days 넘게 멈추면 알림)
#          paused  = 보류 (메일에 한 줄로만)
#          support = 다른 프로젝트가 쓰는 코드·계산 (활동은 기록하되 로드맵 없음)
#          done    = 끝남/보관 (활동이 있으면 기록만)
# path:    study/ 기준 경로. 가장 긴 경로가 먼저 매칭된다.
# roadmap_file: 있으면 활동이 있는 날 그 파일 앞부분을 요약기에 같이 보여준다.
# deadline: YYYY-MM-DD (메일에 D-day로 표시)
#
# 2026-11-23 처음 채움: 2026/README.md 색인과 각 폴더 문서를 보고 넣었다.
# goal/next/deadline은 직접 확인해서 고쳐 주세요. "확인 필요"라고 적힌 곳은 추정이다.

